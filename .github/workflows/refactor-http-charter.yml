name: HTTP charter refactor

on:
  push:
    branches: [refactor/http-charter-structure]
    paths:
      - '.github/workflows/refactor-http-charter.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refactor/http-charter-structure

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev
          cpanm --notest --installdeps .

      - name: Refactor namespace and consolidate HTTP/1 XS
        shell: bash
        run: |
          set -euo pipefail

          git mv lib/Linux/Event/Net/HTTP.pm lib/Linux/Event/HTTP.pm
          git mv lib/Linux/Event/Net/HTTP lib/Linux/Event/HTTP
          mkdir -p lib/Linux/Event/HTTP/Server
          git mv lib/Linux/Event/HTTP/Connection.pm lib/Linux/Event/HTTP/Server/Connection.pm

          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def tracked_files():
              out = subprocess.check_output(['git', 'ls-files', '-z'])
              return [Path(p.decode()) for p in out.split(b'\0') if p]

          replacements = [
              (b'Linux::Event::Net::HTTP', b'Linux::Event::HTTP'),
              (b'Linux::Event::HTTP::Connection', b'Linux::Event::HTTP::Server::Connection'),
              (b'lib/Linux/Event/Net/HTTP', b'lib/Linux/Event/HTTP'),
              (b'lib/Linux/Event/HTTP/Connection.pm', b'lib/Linux/Event/HTTP/Server/Connection.pm'),
              (b'perl-Linux-Event-Net-HTTP', b'perl-Linux-Event-HTTP'),
              (b'Linux-Event-Net-HTTP', b'Linux-Event-HTTP'),
          ]

          for path in tracked_files():
              if not path.is_file():
                  continue
              data = path.read_bytes()
              changed = data
              for old, new in replacements:
                  changed = changed.replace(old, new)
              if changed != data:
                  path.write_bytes(changed)

          # Collapse the three private native extensions into xshttp1/HTTP1.xs.
          # Plain C helpers must stay before the first XS MODULE declaration.
          http1_path = Path('xshttp1/HTTP1.xs')
          http1 = http1_path.read_text()
          chunked = Path('xschunked/Chunked.xs').read_text()
          response1 = Path('xsresponse1/Response1.xs').read_text()

          assert 'static struct phr_chunked_decoder *\ndecoder_from_object' in chunked
          assert 'static int\nrequest_method_is_head' in response1
          assert 'static int\nrequest_method_is_head' not in http1
          assert 'decoder_from_object' not in http1
          assert 'request_state_from_object' in http1

          http1 = http1.replace(
              'MODULE = Linux::Event::HTTP::_Parser::HTTP1',
              'MODULE = Linux::Event::HTTP::_HTTP1',
          ).replace(
              'PACKAGE = Linux::Event::HTTP::_Parser::HTTP1',
              'PACKAGE = Linux::Event::HTTP::_HTTP1',
          )

          main_module = http1.index('MODULE = ')
          main_c = http1[:main_module]
          main_xsubs = http1[main_module:]

          chunk_helper_start = chunked.index('static struct phr_chunked_decoder *\ndecoder_from_object')
          chunk_module = chunked.index('MODULE = ')
          chunk_helpers = chunked[chunk_helper_start:chunk_module]
          chunk_xsubs = chunked[chunk_module:].replace(
              'MODULE = Linux::Event::HTTP::_Parser::HTTP1::Chunked',
              'MODULE = Linux::Event::HTTP::_HTTP1',
          ).replace(
              'PACKAGE = Linux::Event::HTTP::_Parser::HTTP1::Chunked',
              'PACKAGE = Linux::Event::HTTP::_HTTP1::Chunked',
          )

          response_helper_start = response1.index('static int\nrequest_method_is_head')
          response_module = response1.index('MODULE = ')
          response_helpers = response1[response_helper_start:response_module]
          response_xsubs = response1[response_module:].replace(
              'MODULE = Linux::Event::HTTP::_Native::Response1',
              'MODULE = Linux::Event::HTTP::_HTTP1',
          ).replace(
              'PACKAGE = Linux::Event::HTTP::_Native::Response1',
              'PACKAGE = Linux::Event::HTTP::_HTTP1',
          )

          http1_path.write_text(
              main_c.rstrip() + '\n\n'
              + chunk_helpers.strip() + '\n\n'
              + response_helpers.strip() + '\n\n'
              + main_xsubs.rstrip() + '\n\n'
              + chunk_xsubs.strip() + '\n\n'
              + response_xsubs.strip() + '\n'
          )

          # One loader and one shared object now own all private HTTP/1 XSUBs.
          Path('lib/Linux/Event/HTTP/_HTTP1.pm').write_text('''package Linux::Event::HTTP::_HTTP1;
use v5.36;
use strict;
use warnings;

our $VERSION = '0.001';

require XSLoader;
XSLoader::load(__PACKAGE__);

sub CLONE_SKIP { 1 }

1;
''')

          # Point Perl code, docs, tests, and benchmarks at the consolidated extension.
          second = [
              (b'Linux::Event::HTTP::_Parser::HTTP1::Chunked', b'Linux::Event::HTTP::_HTTP1::Chunked'),
              (b'Linux::Event::HTTP::_Parser::HTTP1', b'Linux::Event::HTTP::_HTTP1'),
              (b'Linux::Event::HTTP::_Native::Response1', b'Linux::Event::HTTP::_HTTP1'),
          ]
          for path in tracked_files() + [Path('lib/Linux/Event/HTTP/_HTTP1.pm')]:
              if not path.is_file():
                  continue
              data = path.read_bytes()
              changed = data
              for old, new in second:
                  changed = changed.replace(old, new)
              if changed != data:
                  path.write_bytes(changed)

          # Build metadata now has one private XS directory and one private family.
          makefile = Path('Makefile.PL')
          text = makefile.read_text()
          text = text.replace("DIR              => [qw(xshttp1 xschunked xsresponse1)],", "DIR              => [qw(xshttp1)],")
          text = re.sub(
              r"        no_index => \{\n            package => \[qw\(\n.*?            \)\],\n        \},",
              "        no_index => {\n            package => [qw(\n                Linux::Event::HTTP::_HTTP1\n                Linux::Event::HTTP::_HTTP1::Chunked\n                Linux::Event::HTTP::_ServerConnection\n                Linux::Event::HTTP::_Upgrade\n            )],\n        },",
              text,
              flags=re.S,
          )
          makefile.write_text(text)

          xs_make = Path('xshttp1/Makefile.PL')
          text = xs_make.read_text()
          text = text.replace("NAME             => 'Linux::Event::HTTP::_Parser::HTTP1'", "NAME             => 'Linux::Event::HTTP::_HTTP1'")
          text = text.replace('Private native HTTP/1 parser for Linux::Event::HTTP', 'Private native HTTP/1 wire primitives for Linux::Event::HTTP')
          xs_make.write_text(text)

          # Remove obsolete loaders/build directories after their code has been merged.
          subprocess.check_call(['git', 'rm', '-r', '-f', 'lib/Linux/Event/HTTP/_Parser'])
          subprocess.check_call(['git', 'rm', '-r', '-f', 'lib/Linux/Event/HTTP/_Native'])
          subprocess.check_call(['git', 'rm', '-r', '-f', 'xschunked'])
          subprocess.check_call(['git', 'rm', '-r', '-f', 'xsresponse1'])

          # Keep MANIFEST exact without introducing this temporary workflow.
          manifest = Path('MANIFEST').read_text().splitlines()
          mapped = []
          for line in manifest:
              line = line.replace('lib/Linux/Event/Net/HTTP', 'lib/Linux/Event/HTTP')
              line = line.replace('lib/Linux/Event/HTTP/Connection.pm', 'lib/Linux/Event/HTTP/Server/Connection.pm')
              if line.startswith('lib/Linux/Event/HTTP/_Parser'):
                  continue
              if line.startswith('lib/Linux/Event/HTTP/_Native'):
                  continue
              if line.startswith('xschunked/') or line.startswith('xsresponse1/'):
                  continue
              mapped.append(line)
          if 'lib/Linux/Event/HTTP/_HTTP1.pm' not in mapped:
              mapped.append('lib/Linux/Event/HTTP/_HTTP1.pm')
          Path('MANIFEST').write_text('\n'.join(sorted(set(mapped))) + '\n')
          PY

          # No old namespace or obsolete private native package may survive.
          if git grep -n 'Linux::Event::Net::HTTP' -- ':!handoff.md'; then
            echo 'old public namespace remains' >&2
            exit 1
          fi
          if git grep -nE 'Linux::Event::HTTP::_Parser::HTTP1|Linux::Event::HTTP::_Native::Response1'; then
            echo 'obsolete private native package remains' >&2
            exit 1
          fi

      - name: Build and test refactor
        run: |
          perl Makefile.PL
          make
          make test
          perl -Mblib bench/run-http-end-to-end.pl --smoke
          make disttest

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor HTTP namespace and consolidate HTTP/1 XS'
          git push origin HEAD:refactor/http-charter-structure
