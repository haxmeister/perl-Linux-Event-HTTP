name: HTTP charter refactor

on:
  push:
    branches: [refactor/http-charter-structure]
    paths:
      - '.github/workflows/refactor-http-charter.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refactor/http-charter-structure

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev
          cpanm --notest --installdeps .

      - name: Refactor namespace and consolidate HTTP/1 XS
        run: |
          python3 .github/refactor-http-charter.py
          python3 .github/refactor-http-loader-fix.py
          if ! git diff --quiet -- .github/workflows; then
            echo 'refactor attempted to modify workflow files' >&2
            git diff -- .github/workflows
            exit 1
          fi

      - name: Build and test refactor
        run: |
          perl Makefile.PL
          make
          make test
          perl -Mblib bench/run-http-end-to-end.pl --smoke
          make disttest
          make clean

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor HTTP namespace and consolidate HTTP/1 XS'
          git push origin HEAD:refactor/http-charter-structure
