name: HTTP raw chunked body A/B

on:
  push:
    branches:
      - experiment/raw-chunked-body

permissions:
  contents: read

concurrency:
  group: raw-chunked-body-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install Linux::Event 0.116 and dependencies
        run: |
          cpanm --notest https://github.com/haxmeister/perl-linux-event/archive/007db40e22374c6d7bf8e056b2d354681d20c852.tar.gz
          cpanm --notest 'Uniform::HTTP::Auth@0.02' || cpanm --notest https://github.com/haxmeister/perl-Uniform-HTTP/archive/b2b243957a8f82dfef6081431d7e5e6f84dc1b08.tar.gz
          cpanm --notest --installdeps .

      - name: Build and test
        run: |
          perl Makefile.PL
          make
          make test

      - name: Chunked body matrix - 4 KiB decoded body
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent_body_ignore,linuxevent_body_ignore_native,linuxevent_body_callback,linuxevent_body_callback_native,linuxevent_body_end,linuxevent_body_end_native,linuxevent_body_callback_end,linuxevent_body_callback_end_native \
            --requests=20000 \
            --warmup=2000 \
            --connections=100 \
            --pipeline=1 \
            --request-body-bytes=4096 \
            --request-body-framing=chunked \
            --request-chunk-bytes=4096 \
            --response-bytes=32 \
            --repeats=5 \
            --json=bench/results/chunked-body-4k.json

      - name: Chunked body matrix - 64 KiB decoded body
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent_body_ignore,linuxevent_body_ignore_native,linuxevent_body_callback,linuxevent_body_callback_native,linuxevent_body_end,linuxevent_body_end_native,linuxevent_body_callback_end,linuxevent_body_callback_end_native \
            --requests=10000 \
            --warmup=1000 \
            --connections=100 \
            --pipeline=1 \
            --request-body-bytes=65536 \
            --request-body-framing=chunked \
            --request-chunk-bytes=4096 \
            --response-bytes=32 \
            --repeats=5 \
            --json=bench/results/chunked-body-64k.json

      - name: Upload chunked body results
        uses: actions/upload-artifact@v4
        with:
          name: raw-chunked-body-results
          path: bench/results/chunked-body-*.json
