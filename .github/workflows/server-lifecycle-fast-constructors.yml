name: HTTP early native-final response experiment

on:
  push:
    branches:
      - experiment/http-server-lifecycle-fast-constructors
    paths-ignore:
      - handoff.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out experiment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install dependencies
        run: |
          cpanm --notest https://github.com/haxmeister/perl-linux-event/archive/b0d5244f42f4c5bf48521406d24dd299341c9770.tar.gz
          cpanm --notest 'Uniform::HTTP::Auth@0.02' || \
            cpanm --notest https://github.com/haxmeister/perl-Uniform-HTTP/archive/b2b243957a8f82dfef6081431d7e5e6f84dc1b08.tar.gz
          cpanm --notest --installdeps .

      - name: Build and test experiment
        run: |
          perl Makefile.PL
          make
          make test

      - name: Build exact pre-experiment baseline
        run: |
          git worktree add /tmp/le-http-before f0272fda8991c4818bd2b5d9139e933b3e0a344f
          cd /tmp/le-http-before
          perl Makefile.PL
          make

      - name: Small GET regression check
        env:
          BENCH_BASE_TREE: /tmp/le-http-before
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent_baseline,linuxevent \
            --strict \
            --requests=50000 \
            --warmup=5000 \
            --connections=100 \
            --pipeline=1 \
            --response-bytes=32 \
            --repeats=5 \
            --json=bench/results/early-native-final-get.json

      - name: 4 KiB POST early-response comparison
        env:
          BENCH_BASE_TREE: /tmp/le-http-before
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent_baseline,linuxevent \
            --strict \
            --requests=30000 \
            --warmup=3000 \
            --connections=100 \
            --pipeline=1 \
            --request-body-bytes=4096 \
            --response-bytes=32 \
            --repeats=7 \
            --json=bench/results/early-native-final-4k.json

      - name: 64 KiB POST early-response comparison
        env:
          BENCH_BASE_TREE: /tmp/le-http-before
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent_baseline,linuxevent \
            --strict \
            --requests=15000 \
            --warmup=1500 \
            --connections=100 \
            --pipeline=1 \
            --request-body-bytes=65536 \
            --response-bytes=32 \
            --repeats=5 \
            --json=bench/results/early-native-final-64k.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: early-native-final-response
          path: |
            bench/results/early-native-final-get.json
            bench/results/early-native-final-4k.json
            bench/results/early-native-final-64k.json
