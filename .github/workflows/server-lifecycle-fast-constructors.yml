name: HTTP current lifecycle ladder

on:
  push:
    branches:
      - experiment/scalar-final-general-fastpath
    paths-ignore:
      - handoff.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: http-current-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out experiment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install dependencies
        run: |
          cpanm --notest https://github.com/haxmeister/perl-linux-event/archive/b0d5244f42f4c5bf48521406d24dd299341c9770.tar.gz
          cpanm --notest 'Uniform::HTTP::Auth@0.02' || \
            cpanm --notest https://github.com/haxmeister/perl-Uniform-HTTP/archive/b2b243957a8f82dfef6081431d7e5e6f84dc1b08.tar.gz
          cpanm --notest --installdeps .

      - name: Build and test
        run: |
          perl Makefile.PL
          make
          make test

      - name: Current lifecycle ladder
        run: |
          perl -Mblib bench/run-http-transaction-ladder.pl \
            --requests=50000 \
            --warmup=5000 \
            --connections=100 \
            --pipeline=1 \
            --response-bytes=32 \
            --repeats=5 \
            --read-budget-bytes=0 \
            --json=bench/results/current-lifecycle.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: current-lifecycle
          path: bench/results/current-lifecycle.json
