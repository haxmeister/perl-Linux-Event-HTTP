name: HTTP cumulative server performance comparison

on:
  push:
    branches:
      - experiment/http-server-lifecycle-fast-constructors
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-cumulative-server-performance
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out optimized branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install dependencies
        run: |
          cpanm --notest https://github.com/haxmeister/perl-linux-event/archive/b0d5244f42f4c5bf48521406d24dd299341c9770.tar.gz
          cpanm --notest 'Uniform::HTTP::Auth@0.02' || \
            cpanm --notest https://github.com/haxmeister/perl-Uniform-HTTP/archive/b2b243957a8f82dfef6081431d7e5e6f84dc1b08.tar.gz
          cpanm --notest Feersum
          cpanm --notest --installdeps .

      - name: Build and test optimized branch
        run: |
          perl Makefile.PL
          make
          make test

      - name: Build and test untouched main
        run: |
          git worktree add /tmp/le-http-main origin/main
          cd /tmp/le-http-main
          perl Makefile.PL
          make
          make test

      - name: Small response cumulative comparison
        env:
          BENCH_MAIN_TREE: /tmp/le-http-main
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent_main,linuxevent,feersum \
            --strict \
            --requests=50000 \
            --warmup=5000 \
            --connections=100 \
            --pipeline=1 \
            --response-bytes=32 \
            --repeats=7 \
            --json=bench/results/cumulative-small.json

      - name: 16 KiB response cumulative comparison
        env:
          BENCH_MAIN_TREE: /tmp/le-http-main
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent_main,linuxevent,feersum \
            --strict \
            --requests=30000 \
            --warmup=3000 \
            --connections=100 \
            --pipeline=1 \
            --response-bytes=16384 \
            --repeats=5 \
            --json=bench/results/cumulative-16k.json

      - name: 4 KiB request-body cumulative comparison
        env:
          BENCH_MAIN_TREE: /tmp/le-http-main
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent_main,linuxevent \
            --strict \
            --requests=30000 \
            --warmup=3000 \
            --connections=100 \
            --pipeline=1 \
            --request-body-bytes=4096 \
            --response-bytes=32 \
            --repeats=5 \
            --json=bench/results/cumulative-body.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-server-performance
          path: |
            bench/results/cumulative-small.json
            bench/results/cumulative-16k.json
            bench/results/cumulative-body.json
