name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Perl ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - perl: '5.36'
            multi_thread: false
            label: '5.36'
          - perl: '5.38'
            multi_thread: false
            label: '5.38'
          - perl: '5.40'
            multi_thread: false
            label: '5.40'
          - perl: '5.42'
            multi_thread: false
            label: '5.42'
          - perl: '5.44'
            multi_thread: false
            label: '5.44'
          - perl: '5'
            multi_thread: false
            label: 'latest'
          - perl: '5'
            multi_thread: true
            label: 'latest threaded'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: ${{ matrix.perl }}
          multi-thread: ${{ matrix.multi_thread }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install pinned current Linux::Event core
        run: |
          cpanm --notest https://github.com/haxmeister/perl-linux-event/archive/refs/tags/v0.117.tar.gz

      - name: Install Uniform::HTTP release dependency
        run: |
          cpanm --notest 'Uniform::HTTP::Auth@0.02' || \
            cpanm --notest https://github.com/haxmeister/perl-Uniform-HTTP/archive/b2b243957a8f82dfef6081431d7e5e6f84dc1b08.tar.gz

      - name: Install HTTP/2 spike dependency
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/http2-nghttp2-spike'
        run: |
          sudo apt-get install --yes libnghttp2-dev
          cpanm --notest 'Net::HTTP2::nghttp2@0.008'

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Build and test
        run: |
          perl Makefile.PL
          make
          make test

      - name: Build exact pre-raw baseline
        if: matrix.perl == '5' && matrix.multi_thread == false && github.head_ref != 'experiment/client-receive-path'
        run: |
          git fetch --depth=1 origin c391b2d8fe6b56b6088569cdadeb86160630be26
          git worktree add --detach "$RUNNER_TEMP/http-baseline" FETCH_HEAD
          cd "$RUNNER_TEMP/http-baseline"
          perl Makefile.PL
          make
          make test

      - name: Same-run production native HTTP comparisons
        if: matrix.perl == '5' && matrix.multi_thread == false && github.head_ref != 'experiment/client-receive-path'
        run: |
          export BENCH_BASE_TREE="$RUNNER_TEMP/http-baseline"
          perl -Mblib bench/run-http-comparison.pl --servers=linuxevent_baseline_content_type,linuxevent_content_type --requests=50000 --warmup=5000 --repeats=7 --response-bytes=32 --json=bench/results/ci-native-default-get32.json
          perl -Mblib bench/run-http-comparison.pl --servers=linuxevent_baseline_content_type,linuxevent_content_type --requests=30000 --warmup=3000 --repeats=7 --response-bytes=16384 --json=bench/results/ci-native-default-get16k.json
          perl -Mblib bench/run-http-comparison.pl --servers=linuxevent_baseline_content_type,linuxevent_content_type --requests=30000 --warmup=3000 --repeats=7 --request-body-bytes=4096 --response-bytes=32 --json=bench/results/ci-native-default-post4k.json

      - name: Upload production native HTTP benchmark results
        if: matrix.perl == '5' && matrix.multi_thread == false && github.head_ref != 'experiment/client-receive-path'
        uses: actions/upload-artifact@v4
        with:
          name: native-http-production-default
          path: bench/results/ci-native-default-*.json

      - name: Build pre-native client receive baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/client-receive-path' && matrix.perl == '5' && matrix.multi_thread == false
        run: |
          git fetch --depth=1 origin a09b16d328e648c3babf3e56f1bdd892ed6e5704
          git worktree add --detach "$RUNNER_TEMP/http-client-baseline" FETCH_HEAD
          cd "$RUNNER_TEMP/http-client-baseline"
          perl Makefile.PL
          make

      - name: HTTP/2 h2spec conformance diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/http2-nghttp2-spike' && matrix.perl == '5' && matrix.multi_thread == false
        continue-on-error: true
        run: |
          set -euo pipefail
          H2SPEC_VERSION=2.6.0
          H2SPEC_DIR="$RUNNER_TEMP/h2spec"
          CERT="$RUNNER_TEMP/h2spec-cert.pem"
          KEY="$RUNNER_TEMP/h2spec-key.pem"
          PORT=18443

          mkdir -p "$H2SPEC_DIR"
          curl --fail --location             "https://github.com/summerwind/h2spec/releases/download/v$H2SPEC_VERSION/h2spec_linux_amd64.tar.gz"             --output "$RUNNER_TEMP/h2spec.tar.gz"
          tar -xzf "$RUNNER_TEMP/h2spec.tar.gz" -C "$H2SPEC_DIR"

          openssl req -x509 -newkey rsa:2048 -nodes             -keyout "$KEY"             -out "$CERT"             -subj "/CN=localhost"             -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"             -days 1 >/dev/null 2>&1

          perl -Mblib tools/http2-h2spec-server.pl             --host 127.0.0.1             --port "$PORT"             --cert "$CERT"             --key "$KEY"             >"$RUNNER_TEMP/h2spec-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 100); do
            if grep -q '^READY ' "$RUNNER_TEMP/h2spec-server.log"; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/h2spec-server.log"
              exit 1
            fi
            sleep 0.1
          done

          if ! grep -q '^READY ' "$RUNNER_TEMP/h2spec-server.log"; then
            cat "$RUNNER_TEMP/h2spec-server.log"
            echo "h2spec target server did not become ready" >&2
            exit 1
          fi

          set +e
          "$H2SPEC_DIR/h2spec" -t -k -h 127.0.0.1 -p "$PORT"             2>&1 | tee "$RUNNER_TEMP/h2spec-output.log"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "===== h2spec target server log ====="
          cat "$RUNNER_TEMP/h2spec-server.log"
          exit "$STATUS"

      - name: Upload HTTP/2 h2spec diagnostic
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'experiment/http2-nghttp2-spike' && matrix.perl == '5' && matrix.multi_thread == false
        uses: actions/upload-artifact@v4
        with:
          name: http2-h2spec-diagnostic
          path: |
            ${{ runner.temp }}/h2spec-output.log
            ${{ runner.temp }}/h2spec-server.log

      - name: End-to-end benchmark smoke
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: perl -Mblib bench/run-http-end-to-end.pl --smoke

      - name: Transaction lifecycle diagnostic smoke
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: perl -Mblib bench/run-http-transaction-ladder.pl --smoke

      - name: Client receive-path benchmark smoke
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: perl -Mblib bench/run-http-client-receive.pl --smoke

      - name: Client receive-path baseline benchmark
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/client-receive-path' && matrix.perl == '5' && matrix.multi_thread == false
        run: |
          mkdir -p bench/results
          cd "$RUNNER_TEMP/http-client-baseline"
          perl -Mblib bench/run-http-client-receive.pl \
            --requests=10000 \
            --warmup=1000 \
            --connections=100 \
            --repeats=3 \
            --head-iterations=50000 \
            --instrument-requests=1000 \
            --json="$GITHUB_WORKSPACE/bench/results/client-receive-baseline.json"

      - name: Client receive-path directional benchmark
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/client-receive-path' && matrix.perl == '5' && matrix.multi_thread == false
        run: |
          mkdir -p bench/results
          perl -Mblib bench/run-http-client-receive.pl \
            --requests=10000 \
            --warmup=1000 \
            --connections=100 \
            --repeats=3 \
            --head-iterations=50000 \
            --instrument-requests=1000 \
            --json=bench/results/client-receive-path.json

      - name: Upload client receive-path benchmark
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/client-receive-path' && matrix.perl == '5' && matrix.multi_thread == false
        uses: actions/upload-artifact@v4
        with:
          name: client-receive-path
          path: |
            bench/results/client-receive-baseline.json
            bench/results/client-receive-path.json

      - name: Distribution integrity
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: make disttest

      - name: Pico parser benchmark
        if: github.event_name == 'workflow_dispatch' && matrix.perl == '5' && matrix.multi_thread == false
        run: perl -Mblib bench/pico-parser.pl --seconds=1

      - name: HTTP end-to-end diagnostic benchmark
        if: github.event_name == 'workflow_dispatch' && matrix.perl == '5' && matrix.multi_thread == false
        run: perl -Mblib bench/run-http-end-to-end.pl --requests=20000 --warmup=2000 --connections=100 --repeats=3

  comparison:
    name: Cross-server diagnostic comparison
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark]'))
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev python3-venv libh2o-evloop-dev pkg-config

      - name: Install HTTP benchmark competitors
        run: |
          cpanm --notest https://github.com/haxmeister/perl-linux-event/archive/refs/tags/v0.117.tar.gz
          cpanm --notest 'Uniform::HTTP::Auth@0.02' || \
            cpanm --notest https://github.com/haxmeister/perl-Uniform-HTTP/archive/b2b243957a8f82dfef6081431d7e5e6f84dc1b08.tar.gz
          cpanm --notest --installdeps .
          cpanm --notest Mojolicious Feersum
          python3 -m venv .venv
          .venv/bin/pip install aiohttp
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build Linux::Event::HTTP
        run: |
          perl Makefile.PL
          make

      - name: HTTP transaction lifecycle diagnostic
        run: |
          perl -Mblib bench/run-http-transaction-ladder.pl \
            --requests=20000 \
            --warmup=2000 \
            --connections=100 \
            --pipeline=1 \
            --response-bytes=32 \
            --repeats=3

      - name: Final-response smoke
        run: |
          perl -Mblib bench/run-http-final-response.pl --smoke

      - name: Final-response diagnostic
        run: |
          perl -Mblib bench/run-http-final-response.pl \
            --requests=20000 \
            --warmup=2000 \
            --connections=100 \
            --pipeline=1 \
            --response-bytes=32 \
            --repeats=3

      - name: Cross-server smoke
        run: |
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent,feersum,mojo,node,go,aiohttp,h2o \
            --smoke \
            --strict

      - name: Cross-server directional benchmark
        run: |
          mkdir -p bench/results
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent,feersum,mojo,node,go,aiohttp,h2o \
            --strict \
            --requests=10000 \
            --warmup=1000 \
            --connections=100 \
            --pipeline=1 \
            --response-bytes=32 \
            --repeats=3 \
            --json=bench/results/cross-server-get32.json
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent,feersum,mojo,node,go,aiohttp,h2o \
            --strict \
            --requests=10000 \
            --warmup=1000 \
            --connections=100 \
            --pipeline=1 \
            --response-bytes=16384 \
            --repeats=3 \
            --json=bench/results/cross-server-get16k.json
          perl -Mblib bench/run-http-comparison.pl \
            --servers=linuxevent,feersum,mojo,node,go,aiohttp,h2o \
            --strict \
            --requests=10000 \
            --warmup=1000 \
            --connections=100 \
            --pipeline=1 \
            --request-body-bytes=4096 \
            --response-bytes=32 \
            --repeats=3 \
            --json=bench/results/cross-server-post4k.json

      - name: Upload cross-server benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cross-server-comparison
          path: bench/results/cross-server-*.json
