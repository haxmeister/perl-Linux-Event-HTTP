name: CI

on:
  push:
    branches:
      - main
      - experiment/picohttpparser
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.36', '5']

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Build and test
        run: |
          perl Makefile.PL
          make
          make test

      - name: Pico parser benchmark
        if: github.ref == 'refs/heads/experiment/picohttpparser' && matrix.perl == '5'
        run: perl -Mblib bench/pico-parser.pl --iterations=100000
