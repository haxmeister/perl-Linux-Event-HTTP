name: Linux::Event::HTTP CI

on:
  push:
    branches: [main, feature/unblock-http-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: HTTP1 and HTTP2 Perl ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { perl: '5.36', multi_thread: false, label: '5.36' }
          - { perl: '5.38', multi_thread: false, label: '5.38' }
          - { perl: '5.40', multi_thread: false, label: '5.40' }
          - { perl: '5.42', multi_thread: false, label: '5.42' }
          - { perl: '5.44', multi_thread: false, label: '5.44' }
          - { perl: '5', multi_thread: false, label: 'latest' }
          - { perl: '5', multi_thread: true, label: 'latest threaded' }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: matrix.perl == '5' && matrix.multi_thread == false
        with:
          repository: haxmeister/perl-Linux-Event-HTTP
          ref: c0bf714e0f08f9031684e2eb4fd70dea3c68449f
          path: .ci-deps/http-baseline

      - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678
        with:
          perl-version: ${{ matrix.perl }}
          multi-thread: ${{ matrix.multi_thread }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev libnghttp2-dev
      - name: HTTP1 dependencies
        run: |
          cpanm --notest 'Linux::Event@0.117' 'Uniform::HTTP@0.06'
          cpanm --notest https://cpan.metacpan.org/authors/id/H/HA/HAX/Unblock-HTTP1-0.13.tar.gz
          cpanm --notest https://cpan.metacpan.org/authors/id/H/HA/HAX/Unblock-HTTP-0.03.tar.gz
      - name: Build and test both input paths
        run: |
          perl Makefile.PL
          make -j2
          make test
          REBUILD_NATIVE_INPUT=0 make test
      - name: Stage F packaged distribution test
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          make disttest
      - name: Runtime stays HTTP1-only
        run: |
          perl -Mblib -MLinux::Event::Loop -MLinux::Event::HTTP::Client -e 'my $c = Linux::Event::HTTP::Client->new(loop => Linux::Event::Loop->new); die "optional engine loaded" if grep { m{^(?:Unblock/HTTP[23]|Net/QUIC|Unblock/WebSocket)} } keys %INC; $c->shutdown'
      - name: Benchmark harness smoke
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          perl -Mblib bench/run-unblock-end-to-end.pl --smoke
          perl -Mblib bench/run-rebuild-client.pl --requests 100 --warmup 10 --repeats 1
          perl bench/run-unblock-retention.pl --requests 4 --body-bytes 4096 --role server
          perl bench/run-unblock-retention.pl --requests 4 --body-bytes 4096 --role client
      - name: Stage B matched legacy/rebuild HTTP1 socket gate
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          (cd .ci-deps/http-baseline && perl Makefile.PL && make -j2)
          for variant in legacy rebuild rebuild legacy; do
            echo "Stage B same-host GET32 end-to-end: $variant"
            if [ "$variant" = legacy ]; then
              (cd .ci-deps/http-baseline && perl -Mblib bench/run-http-end-to-end.pl --requests 10000 --warmup 1000 --connections 100 --pipeline 1 --response-bytes 32 --repeats 2)
            else
              perl -Mblib bench/run-unblock-end-to-end.pl --requests 10000 --warmup 1000 --connections 100 --pipeline 1 --response-bytes 32 --repeats 2
            fi
          done
      - name: Stage B constructor versus engine cost decomposition
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          perl -Mblib bench/run-unblock-cost-breakdown.pl --iterations 12000 --rounds 3
          for input in native perl native perl; do
            echo "Stage B input bridge measured on same host: $input"
            if [ "$input" = native ]; then
              perl -Mblib bench/run-unblock-end-to-end.pl --requests 10000 --warmup 1000 --connections 100 --pipeline 1 --response-bytes 32 --repeats 1
            else
              perl -Mblib bench/run-unblock-end-to-end.pl --no-native-input --requests 10000 --warmup 1000 --connections 100 --pipeline 1 --response-bytes 32 --repeats 1
            fi
          done
      - name: Stage B diagnostic constructor upper bound on real sockets
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          for variant in fresh prebuilt prebuilt fresh; do
            echo "Stage B identical TCP response data: $variant"
            if [ "$variant" = fresh ]; then
              perl -Mblib bench/run-unblock-end-to-end.pl --requests 10000 --warmup 1000 --connections 100 --pipeline 1 --response-bytes 32 --repeats 2
            else
              perl -Mblib bench/run-unblock-end-to-end.pl --diagnostic-prebuilt-response --requests 10000 --warmup 1000 --connections 100 --pipeline 1 --response-bytes 32 --repeats 2
            fi
          done
      - name: Stage B isolated engine and socket profiles (diagnostic)
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          cpanm --notest 'Devel::NYTProf@6.16'
          mkdir -p "$RUNNER_TEMP/http1-profiles"
          NYTPROF="file=$RUNNER_TEMP/http1-profiles/engine.nytprof:start=no:stmts=0:calls=2:clock=2" perl -d:NYTProf bench/run-unblock-engine.pl --case engine_input_and_response --native-input --nytprof --requests 4000
          perl tools/http1-profile-summary.pl "$RUNNER_TEMP/http1-profiles/engine.nytprof" 5000 "$RUNNER_TEMP/http1-profiles/engine.json"
          NYTPROF="file=$RUNNER_TEMP/http1-profiles/socket.nytprof:addpid=1:start=no:stmts=0:calls=2:clock=2" perl -Mblib -d:NYTProf bench/run-unblock-end-to-end.pl --nytprof --requests 4000 --warmup 1000 --repeats 1
          for profile in "$RUNNER_TEMP"/http1-profiles/socket.nytprof.*; do
            perl tools/http1-profile-summary.pl "$profile" 5000 "$profile.json"
          done
      - name: Preserve CPU profile evidence
        if: always() && matrix.perl == '5' && matrix.multi_thread == false
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-published-cpu-profiles
          path: ${{ runner.temp }}/http1-profiles/
          if-no-files-found: warn
          retention-days: 14
      - name: Optional HTTP2 integration
        run: |
          # Install the published engine, never a development checkout.
          cpanm --notest 'Alien::nghttp2@0.003'
          cpanm --notest https://cpan.metacpan.org/authors/id/H/HA/HAX/Unblock-HTTP2-0.13.tar.gz
          perl -MUnblock::HTTP2::_nghttp2 -e 'die "wrong repaired engine" unless $INC{"Unblock/HTTP2/_nghttp2.pm"} =~ /site_perl/'
          REBUILD_REQUIRE_HTTP2=1 make test TEST_FILES=t/rebuild/50-http2.t
          REBUILD_REQUIRE_HTTP2=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/50-http2.t
      - name: Stage C h2spec fixture timing diagnostic (manual only, non-gating)
        if: github.event_name == 'workflow_dispatch' && matrix.perl == '5' && matrix.multi_thread == false
        run: |
          # Perl setup points OPENSSL_CONF to a nonexistent installed path.
          test -r /etc/ssl/openssl.cnf
          export OPENSSL_CONF=/etc/ssl/openssl.cnf
          # Go rejects the upstream v2.6.0 tag as a module-version path;
          # compile the exact v2.6.0 source commit from its own go.mod.
          git clone --quiet --depth 1 --branch v2.6.0 https://github.com/summerwind/h2spec.git "$RUNNER_TEMP/h2spec-src"
          test "$(git -C "$RUNNER_TEMP/h2spec-src" rev-parse HEAD)" = 70ac2294010887f48b18e2d64f5cccd48421fad1
          (cd "$RUNNER_TEMP/h2spec-src" && go build -o "$RUNNER_TEMP/h2spec" ./cmd/h2spec)
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout "$RUNNER_TEMP/h2-key.pem" -out "$RUNNER_TEMP/h2-cert.pem" -subj '/CN=localhost' -addext subjectAltName=DNS:localhost,IP:127.0.0.1 -days 1
          for mode in headers request; do
            port=19371
            if [ "$mode" = request ]; then port=19372; fi
            perl -Mblib tools/http2-h2spec-server.pl --port "$port" --cert "$RUNNER_TEMP/h2-cert.pem" --key "$RUNNER_TEMP/h2-key.pem" --response-mode "$mode" > "$RUNNER_TEMP/h2-$mode.server.log" 2>&1 &
            pid=$!
            ready=0
            for i in $(seq 1 100); do
              if grep -q '^READY ' "$RUNNER_TEMP/h2-$mode.server.log"; then ready=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/h2-$mode.server.log"; exit 1; fi
              sleep 0.1
            done
            if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/h2-$mode.server.log"; exit 1; fi
            result=0
            timeout 180s "$RUNNER_TEMP/h2spec" -t -k -h 127.0.0.1 -p "$port" -j "$RUNNER_TEMP/h2-$mode.xml" > "$RUNNER_TEMP/h2-$mode.log" 2>&1 || result=$?
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$result" -gt 1 ]; then tail -50 "$RUNNER_TEMP/h2-$mode.log"; exit 1; fi
            python3 -c 'import sys, xml.etree.ElementTree as E; root=E.parse(sys.argv[1]).getroot(); cases=root.findall(".//testcase"); failures=[c for c in cases if c.find("failure") is not None or c.find("error") is not None]; skipped=[c for c in cases if c.find("skipped") is not None]; print("STAGE C", sys.argv[2], "total", len(cases), "pass", len(cases)-len(failures)-len(skipped), "skip", len(skipped), "fail", len(failures), flush=True); [print("  FAIL", c.get("classname",""), c.get("name",""), flush=True) for c in failures]; sys.exit(0 if len(cases)>=100 else 2)' "$RUNNER_TEMP/h2-$mode.xml" "$mode"
          done
          echo "Strict conformance is enforced separately by h2spec-parity.yml."
      - name: Optional HTTP3 real QUIC loopback
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          cpanm --notest 'https://cpan.metacpan.org/authors/id/H/HA/HAX/Net-QUIC-0.06.tar.gz' 'https://cpan.metacpan.org/authors/id/H/HA/HAX/Unblock-HTTP3-0.14.tar.gz'
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/70-http3-loopback.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/80-http3-client.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/90-http3-server.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/95-http3-errors.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/96-http3-active-drain.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/97-http3-multiconnection.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/98-http3-credit-malformed.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/99-http3-timeout.t
      - name: Required HTTP1 WebSocket Upgrade
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          cpanm --notest https://cpan.metacpan.org/authors/id/H/HA/HAX/Unblock-WebSocket-0.02.tar.gz
          REBUILD_REQUIRE_WEBSOCKET=1 make test TEST_FILES=t/rebuild/100-websocket-h1.t
          REBUILD_REQUIRE_WEBSOCKET=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/100-websocket-h1.t
          REBUILD_REQUIRE_WEBSOCKET=1 make test TEST_FILES=t/rebuild/101-websocket-client.t
          REBUILD_REQUIRE_WEBSOCKET=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/101-websocket-client.t
          REBUILD_REQUIRE_WEBSOCKET=1 make test TEST_FILES=t/rebuild/106-websocket-tls.t
          REBUILD_REQUIRE_WEBSOCKET=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/106-websocket-tls.t
          REBUILD_REQUIRE_WEBSOCKET=1 make test TEST_FILES=t/rebuild/102-websocket-multiplex.t
          REBUILD_REQUIRE_GENERIC_CONNECT=1 make test TEST_FILES=t/rebuild/107-generic-multiplex.t
          REBUILD_REQUIRE_GENERIC_CONNECT=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/107-generic-multiplex.t
          REBUILD_REQUIRE_WEBSOCKET=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/102-websocket-multiplex.t
      - name: Full published optional stack and source archive
        if: matrix.perl == '5' && matrix.multi_thread == false
        env:
          REBUILD_REQUIRE_HTTP2: 1
          REBUILD_REQUIRE_HTTP3: 1
          REBUILD_REQUIRE_WEBSOCKET: 1
          REBUILD_REQUIRE_GENERIC_CONNECT: 1
        run: |
          perl -MLinux::Event -MUniform::HTTP -MUnblock::HTTP -MUnblock::HTTP1 -MUnblock::HTTP2 -MUnblock::HTTP3 -MNet::QUIC -MUnblock::WebSocket -e 'for my $m (qw(Linux::Event Uniform::HTTP Unblock::HTTP Unblock::HTTP1 Unblock::HTTP2 Unblock::HTTP3 Net::QUIC Unblock::WebSocket)) { printf "%s %s\n", $m, $m->VERSION }'
          make test
          REBUILD_NATIVE_INPUT=0 make test
          make disttest
