name: Unblock reconstruction

on:
  push:
    branches: [feature/unblock-http-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: HTTP1 and HTTP2 Perl ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { perl: '5.36', multi_thread: false, label: '5.36' }
          - { perl: '5.38', multi_thread: false, label: '5.38' }
          - { perl: '5.40', multi_thread: false, label: '5.40' }
          - { perl: '5.42', multi_thread: false, label: '5.42' }
          - { perl: '5.44', multi_thread: false, label: '5.44' }
          - { perl: '5', multi_thread: false, label: 'latest' }
          - { perl: '5', multi_thread: true, label: 'latest threaded' }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: haxmeister/perl-Unblock-HTTP1
          ref: 4d19f59196481ae4460207c5b22c5125fdbfe186
          path: .ci-deps/http1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: matrix.perl == '5' && matrix.multi_thread == false
        with:
          repository: haxmeister/perl-Unblock-HTTP1
          ref: 06a0f5d7c0509ad0deaebe4a8269c03fbe07ea14
          path: .ci-deps/http1-before
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: matrix.perl == '5' && matrix.multi_thread == false
        with:
          repository: haxmeister/perl-Linux-Event-HTTP
          ref: c0bf714e0f08f9031684e2eb4fd70dea3c68449f
          path: .ci-deps/http-baseline
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: haxmeister/perl-Unblock-HTTP
          ref: e9efa51ee0110227945628f3f85a3feedba90558
          path: .ci-deps/unblock
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: matrix.perl == '5' && matrix.multi_thread == false
        with:
          repository: haxmeister/perl-Unblock-WebSocket
          ref: 6f27677e176a3010355e1db5d135895baa3d8128
          path: .ci-deps/websocket
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: matrix.perl == '5' && matrix.multi_thread == false
        with:
          repository: haxmeister/perl-Unblock-HTTP3
          ref: b0585f6083c91a7bdfea0ddbccfefea76ab92362
          path: .ci-deps/http3
      - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678
        with:
          perl-version: ${{ matrix.perl }}
          multi-thread: ${{ matrix.multi_thread }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev libnghttp2-dev
      - name: HTTP1 dependencies
        run: |
          cpanm --notest 'Linux::Event@0.117' 'Uniform::HTTP@0.06' URI HTTP::CookieJar 'Uniform::HTTP::Auth@0.02'
          # Development feature commits; versions are deliberately unchanged.
          cpanm --notest ./.ci-deps/http1
          cpanm --notest ./.ci-deps/unblock
      - name: Build and test both input paths
        run: |
          perl Makefile.PL
          make -j2
          make test
          REBUILD_NATIVE_INPUT=0 make test
      - name: Runtime stays HTTP1-only
        run: |
          perl -Mblib -MLinux::Event::Loop -MLinux::Event::HTTP::Client -e 'my $c = Linux::Event::HTTP::Client->new(loop => Linux::Event::Loop->new); die "optional engine loaded" if grep { m{^(?:Unblock/HTTP[23]|Net/QUIC|Unblock/WebSocket)} } keys %INC; $c->shutdown'
      - name: Benchmark harness smoke
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          perl -Mblib bench/run-unblock-end-to-end.pl --smoke
          perl -Mblib bench/run-rebuild-client.pl --requests 100 --warmup 10 --repeats 1
          perl bench/run-unblock-retention.pl --requests 4 --body-bytes 4096 --role server
          perl bench/run-unblock-retention.pl --requests 4 --body-bytes 4096 --role client
      - name: Stage B paired bodyless HTTP1 CPU comparison
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          perl -I .ci-deps/http1-before/lib -MUnblock::HTTP1::Server -e 'die "before server not loaded" unless $INC{"Unblock/HTTP1/Server.pm"} =~ /http1-before/'
          for variant in before after after before; do
            echo "Stage B engine sample: $variant"
            if [ "$variant" = before ]; then
              perl -I .ci-deps/http1-before/lib -Mblib bench/run-unblock-engine.pl --requests 10000
            else
              perl -Mblib bench/run-unblock-engine.pl --requests 10000
            fi
          done
      - name: Stage B matched legacy/rebuild HTTP1 socket gate
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          (cd .ci-deps/http-baseline && perl Makefile.PL && make -j2)
          for variant in legacy rebuild rebuild legacy; do
            echo "Stage B same-host GET32 end-to-end: $variant"
            if [ "$variant" = legacy ]; then
              (cd .ci-deps/http-baseline && perl -Mblib bench/run-http-end-to-end.pl --requests 10000 --warmup 1000 --connections 100 --pipeline 1 --response-bytes 32 --repeats 2)
            else
              perl -Mblib bench/run-unblock-end-to-end.pl --requests 10000 --warmup 1000 --connections 100 --pipeline 1 --response-bytes 32 --repeats 2
            fi
          done
      - name: Stage B HTTP1 engine CPU hotspots (diagnostic)
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          cpanm --notest Devel::NYTProf
          NYTPROF=file=/tmp/http1-stage-b.nytprof:stmts=0:calls=1 perl -Mblib -d:NYTProf bench/run-unblock-engine.pl --requests 4000
          nytprofcalls /tmp/http1-stage-b.nytprof | perl -ne '
            next unless /\A(.+) (\d+)\s*\z/;
            my ($path, $ticks) = ($1, $2);
            my @names = split /;/, $path;
            my $name = $names[-1];
            $sum{$name} += $ticks;
            $total += $ticks;
            END {
              print "Stage B exclusive CPU call-tree hotspots (NYTProf ticks):\n";
              my @keys = sort { $sum{$b} <=> $sum{$a} } keys %sum;
              for my $i (0 .. ($#keys < 39 ? $#keys : 39)) {
                my $name = $keys[$i];
                printf "%6.2f%%  %11d  %s\n", 100*$sum{$name}/($total || 1), $sum{$name}, $name;
              }
            }
          '
      - name: Optional HTTP2 integration
        run: |
          cpanm --notest 'Unblock::HTTP2@0.12'
          REBUILD_REQUIRE_HTTP2=1 make test TEST_FILES=t/rebuild/50-http2.t
          REBUILD_REQUIRE_HTTP2=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/50-http2.t
      - name: Optional HTTP3 real QUIC loopback
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          cpanm --notest 'Net::QUIC@0.06' 'Unblock::HTTP3@0.13'
          # Coordinated Stage E feature under test, not the released CPAN build.
          cpanm --notest ./.ci-deps/http3
          perl -MUnblock::HTTP3::Body::Stream -e 'my $path = $INC{"Unblock/HTTP3/Body/Stream.pm"}; die "feature source not installed: $path\n" unless $path =~ /site_perl/'
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/70-http3-loopback.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/80-http3-client.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/90-http3-server.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/95-http3-errors.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/96-http3-active-drain.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/97-http3-multiconnection.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/98-http3-credit-malformed.t
          REBUILD_REQUIRE_HTTP3=1 make test TEST_FILES=t/rebuild/99-http3-timeout.t
      - name: Required HTTP1 WebSocket Upgrade
        if: matrix.perl == '5' && matrix.multi_thread == false
        run: |
          cpanm --notest ./.ci-deps/websocket
          REBUILD_REQUIRE_WEBSOCKET=1 make test TEST_FILES=t/rebuild/100-websocket-h1.t
          REBUILD_REQUIRE_WEBSOCKET=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/100-websocket-h1.t
          REBUILD_REQUIRE_WEBSOCKET=1 make test TEST_FILES=t/rebuild/101-websocket-client.t
          REBUILD_REQUIRE_WEBSOCKET=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/101-websocket-client.t
          REBUILD_REQUIRE_WEBSOCKET=1 make test TEST_FILES=t/rebuild/106-websocket-tls.t
          REBUILD_REQUIRE_WEBSOCKET=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/106-websocket-tls.t
          REBUILD_REQUIRE_WEBSOCKET=1 make test TEST_FILES=t/rebuild/102-websocket-multiplex.t
          REBUILD_REQUIRE_GENERIC_CONNECT=1 make test TEST_FILES=t/rebuild/107-generic-multiplex.t
          REBUILD_REQUIRE_GENERIC_CONNECT=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/107-generic-multiplex.t
          REBUILD_REQUIRE_WEBSOCKET=1 REBUILD_NATIVE_INPUT=0 make test TEST_FILES=t/rebuild/102-websocket-multiplex.t
