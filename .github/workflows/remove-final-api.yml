name: Remove public final-response shortcut

on:
  push:
    branches: [refactor/http-charter-structure]
    paths:
      - '.github/workflows/remove-final-api.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refactor/http-charter-structure

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev
          cpanm --notest --installdeps .

      - name: Apply API cleanup
        run: |
          cp .github/remove-final-api.py /tmp/remove-final-api.py
          git rm .github/remove-final-api.py
          python3 /tmp/remove-final-api.py
          if ! git diff --quiet -- .github/workflows; then
            echo 'cleanup attempted to modify workflow files' >&2
            git diff -- .github/workflows
            exit 1
          fi

      - name: Build and test supported API
        run: |
          perl Makefile.PL
          make
          make test
          perl -Mblib bench/run-http-end-to-end.pl --smoke
          perl -Mblib bench/run-http-final-response.pl --smoke
          make disttest
          make clean

      - name: Commit API cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove public final-response shortcut API'
          git push origin HEAD:refactor/http-charter-structure
